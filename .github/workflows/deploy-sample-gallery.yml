name: Deploy Sample Wasm Gallery

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-sample-gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Production Wasm Distribution
        run: ./gradlew :shared:wasmJsBrowserStoriesProductionExecutableDistribution --no-daemon

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: shared/build/dist/wasmJs/StoriesProductionExecutable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
